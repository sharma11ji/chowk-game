name: Build Android prototype
on:
  push:
    paths:
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get Godot and Android export tools
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p templates.tpz templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          curl -fsSL -o build-tools.zip https://dl.google.com/android/repository/build-tools_r35_linux.zip
          curl -fsSL -o platform-tools.zip https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          mkdir -p "$RUNNER_TEMP/chowk-sdk/build-tools/35.0.0"
          unzip -q build-tools.zip -d "$RUNNER_TEMP/build-tools"
          cp -a "$RUNNER_TEMP/build-tools/android-15/." "$RUNNER_TEMP/chowk-sdk/build-tools/35.0.0/"
          unzip -q platform-tools.zip -d "$RUNNER_TEMP/chowk-sdk"
          rm godot.zip templates.tpz build-tools.zip platform-tools.zip
      - name: Configure and export
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --editor --import --quit
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path.home()/'.config/godot/editor_settings-4.7.tres'
          s=p.read_text()
          for name,value in {'java_sdk_path':os.environ['JAVA_HOME'],'android_sdk_path':os.environ['RUNNER_TEMP']+'/chowk-sdk'}.items():
              key='export/android/'+name
              s=re.sub(r'^'+re.escape(key)+r' = .*$',key+' = "'+value+'"',s,flags=re.M)
          p.write_text(s)
          PY
          mkdir -p export
          "$GODOT" --headless --export-debug Android export/CHOWK-v1-debug.apk
          "$RUNNER_TEMP/chowk-sdk/build-tools/35.0.0/apksigner" verify --verbose export/CHOWK-v1-debug.apk
          sha256sum export/CHOWK-v1-debug.apk > export/SHA256SUMS.txt
      - name: Publish prototype release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          First playable CHOWK - Apna Mohalla Android prototype.
          Tap an open part of the town to walk, or hold the bottom-left directional pad.
          Chai tapri, kirana store, four houses, sabzi cart and two stationary NPCs.
          No dialogue or missions yet.

          Android 7.0 or newer, ARM64 and ARMv7, portrait. Offline; no Android permissions requested.
          Debug-signed prototype, not a Play Store build. Physical-phone testing is pending.
          Download CHOWK-v1-debug.apk from Assets. Open it on your phone. Grant install permission only to the app opening this APK if Android asks, and turn it off afterward. If a security scan warns or installation fails, stop and share a screenshot.
          SHA256SUMS.txt contains the APK checksum.
          NOTES
          gh release create v0.1.0 export/CHOWK-v1-debug.apk export/SHA256SUMS.txt --title 'CHOWK v1 - Apna Mohalla (Android prototype)' --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --target "$GITHUB_SHA"
